spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.jwt.secret=${APP_JWT_SECRET}

signature.enabled=true
signature.algorithm=SHA256withRSA
signature.key-store-path=classpath:signing.jks
signature.key-store-type=JKS
signature.key-store-password=changeit
signature.key-alias=app-signing
signature.key-password=

binary.export.manifest-magic=MF-Mansurov
binary.export.data-magic=DB-Mansurov
binary.export.manifest-filename=manifest.bin
binary.export.data-filename=data.bin

signature.file.first-bytes-length=4

storage.minio.endpoint=http://localhost:9000
storage.minio.access-key=${MINIO_ACCESS_KEY:test-minio-access-key}
storage.minio.secret-key=${MINIO_SECRET_KEY:test-minio-secret-key}
storage.minio.bucket=signature-files
storage.minio.presigned-url-expiry-seconds=900
