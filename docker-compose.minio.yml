version: "3.9"

services:
  minio:
    image: minio/minio:latest
    container_name: rbpo-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:latest
    container_name: rbpo-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required} ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}; do
        echo 'Waiting for MinIO to be ready...';
        sleep 2;
      done;
      mc mb --ignore-existing local/${MINIO_BUCKET:-signature-files};
      mc anonymous set none local/${MINIO_BUCKET:-signature-files};
      mc admin user add local ${MINIO_APP_ACCESS_KEY:?MINIO_APP_ACCESS_KEY is required} ${MINIO_APP_SECRET_KEY:?MINIO_APP_SECRET_KEY is required} || true;
      mc admin policy attach local readwrite --user ${MINIO_APP_ACCESS_KEY:?MINIO_APP_ACCESS_KEY is required};
      echo 'MinIO bucket and app credentials are configured';
      "
    restart: "no"

volumes:
  minio-data:
